<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:fragment="head(pageTitle)">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f7f8" />
    <title th:text="${pageTitle} + ' · TONGA'">TONGA</title>
    <link rel="icon" th:href="@{/icons/favicon.svg}" type="image/svg+xml" />
    <link rel="stylesheet" th:href="@{/css/app.css}" />
    <script th:src="@{/js/main.js}" defer></script>
  </head>
  <body>
    <aside th:fragment="sidebar(active)" class="sidebar" id="sidebar">
      <a href="/dashboard" class="brand brand-sidebar" aria-label="TONGA dashboard">
        <span class="brand-mark"
          ><svg aria-hidden="true"><use href="/icons/sprite.svg#scan"></use></svg
        ></span>
        <span>TONGA<span class="brand-dot">.</span></span>
      </a>
      <div class="nav-caption">WORKSPACE</div>
      <nav aria-label="Main navigation" class="sidebar-nav">
        <a
          th:href="@{/dashboard}"
          th:classappend="${active == 'dashboard'} ? ' nav-active' : ''"
          class="nav-link"
        >
          <svg aria-hidden="true"><use href="/icons/sprite.svg#dashboard"></use></svg> Dashboard
        </a>
        <a
          th:href="@{/persons}"
          th:classappend="${active == 'persons'} ? ' nav-active' : ''"
          class="nav-link"
        >
          <svg aria-hidden="true"><use href="/icons/sprite.svg#users"></use></svg> People
        </a>
        <a
          th:href="@{/presence}"
          th:classappend="${active == 'presence'} ? ' nav-active' : ''"
          class="nav-link"
        >
          <svg aria-hidden="true"><use href="/icons/sprite.svg#calendar"></use></svg> Presence
        </a>
      </nav>
      <div class="sidebar-bottom">
        <div class="sidebar-system"><span class="status-pulse"></span> System ready</div>
        <form th:action="@{/logout}" method="post">
          <button type="submit" class="nav-link logout-link">
            <svg aria-hidden="true"><use href="/icons/sprite.svg#log-out"></use></svg> Sign out
          </button>
        </form>
      </div>
    </aside>
    <header th:fragment="mobileHeader" class="mobile-header">
      <a href="/dashboard" class="brand" aria-label="TONGA dashboard">
        <span class="brand-mark"
          ><svg aria-hidden="true"><use href="/icons/sprite.svg#scan"></use></svg
        ></span>
        TONGA<span class="brand-dot">.</span>
      </a>
      <button
        type="button"
        class="icon-button"
        id="menu-toggle"
        aria-controls="sidebar"
        aria-expanded="false"
        aria-label="Toggle menu"
      >
        <svg aria-hidden="true"><use href="/icons/sprite.svg#menu"></use></svg>
      </button>
    </header>
    <div th:fragment="notice" th:if="${notice}" role="status" class="notice">
      <svg aria-hidden="true"><use href="/icons/sprite.svg#check"></use></svg
      ><span th:text="${notice}"></span>
    </div>
  </body>
</html>
