<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments/layout :: head('Sign in')}"></head>
  <body class="login-page">
    <main class="login-card">
      <a class="brand justify-center" th:href="@{/}"
        ><span class="brand-mark"
          ><svg aria-hidden="true">
            <use href="/icons/sprite.svg#scan"></use></svg
        ></span>
        TONGA<span class="brand-dot">.</span></a
      >
      <div class="login-intro">
        <span class="eyebrow small">ADMIN AREA</span>
        <h1>Welcome back.</h1>
        <p>Sign in to manage people and presence.</p>
      </div>
      <div th:if="${param.error}" class="form-alert" role="alert">
        Incorrect username or password.
      </div>
      <div th:if="${param.logout}" class="notice" role="status">
        You have signed out.
      </div>
      <form th:action="@{/login}" method="post" class="form-stack">
        <input
          type="hidden"
          th:name="${_csrf.parameterName}"
          th:value="${_csrf.token}"
        />
        <div class="form-field">
          <label for="username">Username</label
          ><input
            id="username"
            name="username"
            type="text"
            autocomplete="username"
            required
            autofocus
            placeholder="Enter username"
          />
        </div>
        <div class="form-field">
          <label for="password">Password</label
          ><input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            placeholder="Enter password"
          />
        </div>
        <button type="submit" class="button button-primary button-full">
          Sign in
          <svg aria-hidden="true">
            <use href="/icons/sprite.svg#arrow-right"></use>
          </svg>
        </button>
      </form>
      <a class="return-link" th:href="@{/}"
        ><svg aria-hidden="true">
          <use href="/icons/sprite.svg#arrow-left"></use>
        </svg>
        Back to home</a
      >
    </main>
  </body>
</html>
