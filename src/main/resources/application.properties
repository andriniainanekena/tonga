spring.application.name=tonga
server.address=${TONGA_HOST:0.0.0.0}
server.port=${TONGA_PORT:8080}
spring.datasource.url=${TONGA_DB_URL:jdbc:postgresql://localhost:5432/tonga}
spring.datasource.username=${TONGA_DB_USER:tonga}
spring.datasource.password=${TONGA_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.thymeleaf.cache=true
spring.web.locale=en
spring.web.locale-resolver=fixed
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.error.include-message=never
server.error.include-stacktrace=never
spring.mvc.hiddenmethod.filter.enabled=false
tonga.admin.username=admin
tonga.admin.password=${TONGA_ADMIN_PASSWORD}
tonga.device.id=${TONGA_DEVICE_ID:reader-01}
tonga.device.key=${TONGA_DEVICE_KEY}
tonga.time-zone=${TONGA_TIME_ZONE:Indian/Antananarivo}
